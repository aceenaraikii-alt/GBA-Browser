<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>GBA Loader</title>
        <link rel="stylesheet" href="emulator.css">
    </head>
    <body>
        <div id="game"></div>
        <script>
            // Get the game filename from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const gameFile = urlParams.get('game');

            EJS_player = '#game';
            EJS_core = 'gba';
            EJS_gameUrl = gameFile; // This pulls the path we set in the OS
            EJS_pathtodata = './'; // Since everything is in this folder now
        </script>
        <script src="loader.js"></script>
    </body>
</html>
